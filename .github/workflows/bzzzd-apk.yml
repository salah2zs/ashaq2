name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q "salah-vpn (1).zip" -d project

      - name: Download libv2ray
        run: |
          mkdir -p project/app/libs
          curl -fL --retry 3 \
            "https://sourceforge.net/projects/androidlibxraylite.mirror/files/v26.9.9/libv2ray.aar/download" \
            -o project/app/libs/libv2ray.aar
          test -s project/app/libs/libv2ray.aar
          unzip -t project/app/libs/libv2ray.aar

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salah-vpn-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
